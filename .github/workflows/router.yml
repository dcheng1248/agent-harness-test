name: Router
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
jobs:
  route:
    if: >-
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '/answer')) ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'plan-approved') ||
      (github.event_name == 'workflow_run' && startsWith(github.event.workflow_run.head_branch, 'agent/issue-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node .agent/scripts/route.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_REVIEWERS: ${{ vars.AGENT_REVIEWERS }}
