name: Dispatch
on:
  issues:
    types: [labeled, closed, reopened]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
# A lock only. The dispatcher re-reads all state, so a replaced pending run loses nothing.
concurrency:
  group: dispatch
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  dispatch:
    if: github.event_name != 'issues' || github.event.action != 'labeled' || github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: github.event_name == 'issues' && github.event.action == 'labeled'
        name: Let a batch of new issues and links finish
        run: sleep 120
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node .agent/scripts/dispatch.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_REVIEWERS: ${{ vars.AGENT_REVIEWERS }}
          MAX_ACTIVE_ISSUES: ${{ vars.MAX_ACTIVE_ISSUES }}
