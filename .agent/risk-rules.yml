# Minimum risk from the real diff. Explained in docs/harness/risk-rules.md.
# Core paths in core-paths.yml are always at least medium.
# No path is high by itself: a path cannot tell an added field from a breaking change,
# so the planner judges high. Harness changes are always high (rules.mjs). Add a
# `high_paths:` list here only for a path that is risky whatever the change.
medium_paths:
  - package.json
  - package-lock.json
  - packages/*/package.json
  - tsconfig.json
  - vitest.config.ts
  - packages/web/vite.config.*
